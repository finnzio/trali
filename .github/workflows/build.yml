name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - platform: windows-latest
            args: ""
            name: windows-x64
            assetNamePattern: Trali-v[version]-[platform]-[arch][setup][ext]
          # macOS Apple Silicon
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macos-aarch64
            assetNamePattern: Trali-v[version]-macOS-Apple-Silicon[ext]
          # macOS Intel
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: macos-x64
            assetNamePattern: Trali-v[version]-macOS-Intel[ext]
          # Linux
          - platform: ubuntu-22.04
            args: ""
            name: linux-x64
            assetNamePattern: Trali-v[version]-[platform]-[arch][setup][ext]

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          # Draft release only on version tags (e.g. v0.1.0).
          # Leave empty on branch/PR builds so no release is created.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || '' }}
          releaseName: Trali v__VERSION__
          releaseBody: |
            Download installers for Windows, macOS, and Linux from the assets below.

            | Platform | Architecture | Packages |
            |----------|--------------|----------|
            | Windows | x64 | `.msi`, NSIS `.exe` |
            | macOS | Apple Silicon (aarch64) | `.dmg` |
            | macOS | Intel (x64) | `.dmg` |
            | Linux | x64 (amd64) | `.AppImage`, `.deb` |
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: trali-[platform]-[arch]-[bundle]
          releaseAssetNamePattern: ${{ matrix.assetNamePattern }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
