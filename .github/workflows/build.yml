name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main, codex/single-instance-tray]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - platform: windows-latest
            args: ""
            name: windows-x64
            assetNamePattern: Trali-v[version]-[platform]-[arch][setup][ext]
          # macOS Apple Silicon
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macos-aarch64
            assetNamePattern: Trali-v[version]-macOS-Apple-Silicon[ext]
          # macOS Intel
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: macos-x64
            assetNamePattern: Trali-v[version]-macOS-Intel[ext]
          # Linux
          - platform: ubuntu-22.04
            args: ""
            name: linux-x64
            assetNamePattern: Trali-v[version]-[platform]-[arch][setup][ext]

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: ${{ matrix.name }}

      - name: Shared restore-path unit test
        if: matrix.platform == 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml second_instance_restores_hidden_main_window -- --nocapture

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          # Draft release only on version tags (e.g. v0.1.0).
          # Leave empty on branch/PR builds so no release is created.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || '' }}
          releaseName: Trali v__VERSION__
          releaseBody: |
            Download installers for Windows, macOS, and Linux from the assets below.

            | Platform | Architecture | Packages |
            |----------|--------------|----------|
            | Windows | x64 | `.msi`, NSIS `.exe` |
            | macOS | Apple Silicon (aarch64) | `.dmg` |
            | macOS | Intel (x64) | `.dmg` |
            | Linux | x64 (amd64) | `.AppImage`, `.deb` |
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: trali-[platform]-[arch]-[bundle]
          releaseAssetNamePattern: ${{ matrix.assetNamePattern }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

  windows-single-instance:
    name: windows-single-instance
    needs: build
    if: ${{ always() && !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure WebView2 runtime
        shell: pwsh
        run: |
          $paths = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          )
          $found = $null
          foreach ($path in $paths) {
            $found = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
            if ($found) { break }
          }
          if ($found) {
            Write-Host "WebView2 already installed: $($found.pv)"
            exit 0
          }
          Write-Host "Installing WebView2 Evergreen Runtime"
          $bootstrapper = Join-Path $env:TEMP "MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $bootstrapper
          Start-Process -FilePath $bootstrapper -ArgumentList "/silent", "/install" -Wait

      - name: Download Windows NSIS installer
        uses: actions/download-artifact@v4
        with:
          name: trali-windows-x64-nsis
          path: installer

      - name: List installer artifact
        shell: pwsh
        run: Get-ChildItem -Path installer -Recurse | Format-Table Name, Length, FullName

      - name: Silent-install NSIS build and assert cases 1-6
        shell: pwsh
        run: ./scripts/windows-single-instance-acceptance.ps1 -InstallerDir installer

      - name: Cleanup leftover Trali install
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name Trali -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $uninstallers = Get-ChildItem -Path "$env:LOCALAPPDATA\Trali","$env:LOCALAPPDATA\Programs\Trali" -Filter uninstall.exe -Recurse -ErrorAction SilentlyContinue
          foreach ($uninstaller in $uninstallers) {
            Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait -ErrorAction SilentlyContinue
          }
          Get-Process -Name Trali -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          foreach ($path in @("$env:LOCALAPPDATA\Trali", "$env:LOCALAPPDATA\Programs\Trali")) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
