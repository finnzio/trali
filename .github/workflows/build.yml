name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - platform: windows-latest
            args: ""
            name: windows-x64
            assetNamePattern: Trali-v[version]-[platform]-[arch][setup][ext]
          # macOS Apple Silicon
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macos-aarch64
            assetNamePattern: Trali-v[version]-macOS-Apple-Silicon[ext]
          # macOS Intel
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: macos-x64
            assetNamePattern: Trali-v[version]-macOS-Intel[ext]
          # Linux
          - platform: ubuntu-22.04
            args: ""
            name: linux-x64
            assetNamePattern: Trali-v[version]-[platform]-[arch][setup][ext]

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Read changelog for this version
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: node scripts/release-notes.mjs "${{ github.ref_name }}" --github-output

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          # Draft release only on version tags (e.g. v0.1.0).
          # Leave empty on branch/PR builds so no release is created.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || '' }}
          releaseName: Trali v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: trali-[platform]-[arch]-[bundle]
          releaseAssetNamePattern: ${{ matrix.assetNamePattern }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

      - name: Locate Windows NSIS installer
        id: nsis
        if: matrix.name == 'windows-x64' && startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNPATH_API_TOKEN) -or [string]::IsNullOrEmpty($env:SIGNPATH_ORGANIZATION_ID)) {
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "SignPath secrets are unset; skipping NSIS locate"
            exit 0
          }
          $nsisDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/release/bundle/nsis"
          $setup = @(
            Get-ChildItem -Path $nsisDir -Filter "*setup.exe" -ErrorAction SilentlyContinue -File
          )
          if ($setup.Count -ne 1) {
            throw "Expected exactly one NSIS *setup.exe under $nsisDir, found $($setup.Count)"
          }
          $rel = "src-tauri/target/release/bundle/nsis/$($setup[0].Name)"
          "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "path=$rel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Found $rel"

      - name: Upload unsigned Windows NSIS
        id: upload
        if: steps.nsis.outcome == 'success' && steps.nsis.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-nsis
          path: ${{ steps.nsis.outputs.path }}
          if-no-files-found: error

  sign-windows-nsis:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check SignPath secrets
        id: gate
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNPATH_API_TOKEN) -or [string]::IsNullOrEmpty($env:SIGNPATH_ORGANIZATION_ID)) {
            "should_sign=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "SignPath secrets are unset; skipping signing"
            exit 0
          }
          "should_sign=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout
        if: steps.gate.outputs.should_sign == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.gate.outputs.should_sign == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        if: steps.gate.outputs.should_sign == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install frontend dependencies
        if: steps.gate.outputs.should_sign == 'true'
        run: pnpm install --frozen-lockfile

      - name: Download unsigned Windows NSIS
        if: steps.gate.outputs.should_sign == 'true'
        uses: actions/download-artifact@v4
        with:
          name: unsigned-windows-nsis
          path: unsigned-nsis

      - name: Re-upload unsigned Windows NSIS for SignPath
        id: upload
        if: steps.gate.outputs.should_sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-nsis-sign
          path: unsigned-nsis
          if-no-files-found: error

      - name: Submit SignPath signing request
        id: signpath
        if: steps.gate.outputs.should_sign == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: trali
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-nsis
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ github.workspace }}/signed-nsis

      - name: Publish signed NSIS and refresh updater signature
        if: steps.gate.outputs.should_sign == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: ./scripts/publish-signed-nsis.ps1
